<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dem-t dem-d">
          <rect width="800" height="440" fill="#c3b9ad"/><title id="dem-t">How a demand zone forms and is used</title>
          <desc id="dem-d">Price falls in a series of down candles. The last down candle is followed by three strong up candles that leave an imbalance and close above the previous lower high, marked BoS. The demand zone is drawn from that last down candle, from its low to its open, and extended to the right. Price later falls back through the imbalance, touches the top of the zone and rallies to a new high.</desc>
